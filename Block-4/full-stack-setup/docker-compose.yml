version: '3.9'

services:
  mongo:
    image: mongo:4.2.0
    container_name: mongo
    volumes:
      - mongo-data:/data/db
    networks:
      - backend-net

  backend:
    build:
      context: ./backend
    container_name: backend
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://mongo:27017
    networks:
      - backend-net
      - frontend-net

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - frontend-net

volumes:
  mongo-data:

networks:
  backend-net:
  frontend-net: